name: Native correctness

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LOCKDC_CTEST_PARALLEL_LEVEL: "1"
  LOCKDC_TMP_AUTO_CLEANUP_STALE_SECONDS: "-1"
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  test:
    name: ${{ matrix.arch }} / ${{ matrix.filesystem }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            filesystem: xfs
            deps: deps-x86_64-linux-gnu
            preset: x86_64-linux-gnu-release
          - runner: ubuntu-26.04-arm
            arch: aarch64
            filesystem: ext4
            deps: deps-aarch64-linux-gnu-native
            preset: aarch64-linux-gnu-native
          - runner: ubuntu-26.04-arm
            arch: aarch64
            filesystem: xfs
            deps: deps-aarch64-linux-gnu-native
            preset: aarch64-linux-gnu-native
          - runner: macos-15
            arch: arm64
            filesystem: apfs
            deps: deps-arm64-apple-darwin-native
            preset: arm64-apple-darwin-native
    defaults:
      run:
        shell: bash
        working-directory: suite
    steps:
      - name: Mount Linux test filesystem
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        env:
          FILESYSTEM: ${{ matrix.filesystem }}
        run: |
          packages=(ninja-build pkg-config)
          case "$FILESYSTEM" in
            ext4) packages+=(e2fsprogs) ;;
            xfs) packages+=(xfsprogs) ;;
          esac
          if [ "$(uname -m)" = aarch64 ]; then packages+=(gcc-15); fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
          image="$RUNNER_TEMP/native-correctness.img"
          truncate -s 8G "$image"
          case "$FILESYSTEM" in
            ext4) mkfs.ext4 -F "$image" ;;
            xfs) mkfs.xfs -f "$image" ;;
          esac
          mkdir suite
          sudo mount -o loop "$image" suite
          sudo chown "$(id -u):$(id -g)" suite
          if [ "$FILESYSTEM" = ext4 ]; then sudo rmdir suite/lost+found; fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: suite
          persist-credentials: false

      - name: Select native macOS tools
        if: runner.os == 'macOS'
        run: |
          brew list --versions bash >/dev/null || brew install bash
          brew list --versions flock >/dev/null || brew install flock
          brew list --versions llvm >/dev/null || brew install llvm
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "CC=$(xcrun --find clang)" >> "$GITHUB_ENV"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          echo 'MACOSX_DEPLOYMENT_TARGET=15.0' >> "$GITHUB_ENV"

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.27.2"
          cache: false

      - name: Verify test architecture and filesystem
        env:
          ARCH: ${{ matrix.arch }}
          FILESYSTEM: ${{ matrix.filesystem }}
        run: |
          test "$(uname -m)" = "$ARCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p build/tmp
          if [ "$RUNNER_OS" = Linux ]; then
            actual=$(findmnt -n -o FSTYPE -T "$PWD/build/tmp")
            printf 'Test source %s on %s / %s\n' "$GITHUB_SHA" "$ARCH" "$actual"
            test "$actual" = "$FILESYSTEM"
          fi
          echo "TMPDIR=$PWD/build/tmp" >> "$GITHUB_ENV"

      - name: Build unit and E2E executables
        id: build
        env:
          DEPS: ${{ matrix.deps }}
          PRESET: ${{ matrix.preset }}
        run: |
          bash scripts/deps.sh "$DEPS"
          cmake --preset "$PRESET" -B build/native-correctness \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLOCKDC_BUILD_E2E_TESTS=ON -DLOCKDC_E2E_LUA_BUILD_TREE=ON \
            -DLOCKDC_BUILD_EXAMPLES=ON \
            -DLOCKDC_BUILD_BENCHMARKS=OFF -DLOCKDC_INSTALL=ON \
            -DLOCKDC_BUILD_SHARED=ON -DLOCKDC_BUILD_LUA_BINDINGS=ON
          cmake --build build/native-correctness --parallel 3
          if [ "$RUNNER_OS" = macOS ]; then
            probe="$PWD/build/native-correctness/experiments/pouch_space/pouch_space_platform_test"
            volume=$("$probe" --describe-volume "$PWD/build/tmp")
            printf 'Test source %s on %s / %s\n' "$GITHUB_SHA" "$ARCH" "$volume"
            case "$volume" in
              'filesystem=apfs '*) ;;
              *) echo 'The native test directory must be on APFS' >&2; exit 1 ;;
            esac
          fi

      - name: Run unit and offline integration tests
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          labels='^(e2e|release-artifact)$'
          excluded='package_source_dist_dir_test|runtime_license_install_tree_test|lua_core_package_test|lua_postgres_package_test'
          if [ "$ARCH" != x86_64 ]; then
            labels='^(e2e|release-artifact|lifecycle-host)$'
          fi
          ctest --test-dir build/native-correctness --parallel "$LOCKDC_CTEST_PARALLEL_LEVEL" \
            --no-tests=error --output-on-failure --output-junit "$PWD/build/unit.xml" \
            -LE "$labels" -E "^($excluded)$"

      - name: Run E2E tests with native services
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          bash scripts/build-e2e-fixtures.sh
          bash scripts/test-e2e.sh --native build/native-correctness

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: tests-${{ matrix.arch }}-${{ matrix.filesystem }}
          path: |
            suite/build/unit.xml
            suite/build/devenv/logs/ctest.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Unmount Linux test filesystem
        if: ${{ always() && runner.os == 'Linux' }}
        working-directory: ${{ github.workspace }}
        run: |
          if mountpoint -q suite; then sudo umount suite; fi
